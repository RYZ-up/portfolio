<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page use the full screen on notched phones;
         the layout keeps clear of the cut-outs with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours the browser UI (Android address bar, iOS status bar) like the page. -->
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <title>Bienvenue chez moi</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Paints the page in the right theme's color immediately, before the
         app's stylesheet has loaded, so the default white background never
         flashes for a returning light-theme visitor. Storage can be blocked,
         hence the try/catch: a throw here would stop the whole page. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('theme-light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1f1f23');
        }
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        background-color: #0a0a0c;
        margin: 0;
        color-scheme: dark;
      }

      html.theme-light,
      html.theme-light body {
        background-color: #1f1f23;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
