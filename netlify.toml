[build]
  command = "npm run build"
  publish = "dist"

# @netlify/blobs (visit counter) needs Node 22.
[build.environment]
  NODE_VERSION = "22"

# The three projects pages (and one URL per project: /web/p4...) are real
# URLs served by the single-page app.
[[redirects]]
  from = "/logiciels"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/logiciels/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/web"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/web/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/electronique"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/electronique/*"
  to = "/index.html"
  status = 200

# Old address of the software page (Oct. 2026).
[[redirects]]
  from = "/developpement"
  to = "/logiciels"
  status = 301

[[redirects]]
  from = "/developpement/*"
  to = "/logiciels"
  status = 301

[functions]
  directory = "netlify/functions"

# Vite fingerprints everything under /assets: cache it for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Copied as-is from public/ (no hash in the name): a week, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers for every page. (No Content-Security-Policy on purpose: the
# site calls several external APIs and fonts, and a wrong policy would break it.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
