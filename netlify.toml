[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Vite fingerprints everything under /assets: cache it for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Copied as-is from public/ (no hash in the name): a week, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers for every page. (No Content-Security-Policy on purpose: the
# site calls several external APIs and fonts, and a wrong policy would break it.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
