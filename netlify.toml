[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Vite fingerprints everything under /assets: cache it for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Copied as-is from public/ (no hash in the name): a week, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
